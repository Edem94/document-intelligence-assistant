# CI/CD: runs on every pull request into main, on every push to main, and on demand (Actions tab).
#   tests + docker  - every run. Need no secrets: unit tests stub out the LLM, and the container
#                     smoke test only checks that the app starts and serves its UI.
#   deploy          - pushes to main only, after both checks pass: image -> Artifact Registry -> Cloud Run.
#                     Skipped until the GCP_* repository variables are set (see the one-time setup).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR branch cancels the previous, now-outdated run. Runs on main are never
# cancelled, so a deploy is not interrupted halfway; they queue instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install dependencies (CPU-only PyTorch, same as the Dockerfile)
        run: |
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.lock.txt pytest

      - name: Run tests
        run: python -m pytest tests -v

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: document-intelligence-assistant:ci
          # Reuse layers between runs (packages, model, index) - first run ~12 min, later runs much faster
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        # A placeholder key is enough: startup only loads the embedding model and the index
        run: docker run -d --name app -p 8000:8000 -e ANTHROPIC_API_KEY=ci-placeholder document-intelligence-assistant:ci

      - name: Wait until the container is healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' app)
            echo "health: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            if [ "$status" = "unhealthy" ]; then break; fi
            sleep 5
          done
          echo "Container did not become healthy"
          exit 1

      - name: Smoke test endpoints
        run: |
          curl -fsS localhost:8000/health
          curl -fsS localhost:8000/ | grep -q "<title>Document Intelligence Assistant</title>"
          curl -fsS -o /dev/null localhost:8000/static/app.js
          echo "All endpoints OK"

      - name: Container logs
        if: always()
        run: docker logs app || true

  deploy:
    name: Deploy to Cloud Run
    needs: [tests, docker]
    # Only for merges/pushes to main, and only once the GCP repository variables exist
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production   # Settings > Environments: optionally require your approval before deploying
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write    # short-lived OIDC token for Workload Identity Federation - no JSON key stored
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/document-intelligence-assistant:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Let Docker push to Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image (tagged with the commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha   # reuses the layers the docker job just built
          provenance: false      # single-platform image manifest, no attestation index

      - name: Deploy
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: document-intelligence-assistant
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          # --port: the image's uvicorn listens on 8000 (Cloud Run's default is 8080)
          # --memory: ~740 MiB at rest (embedding model + index), headroom for requests
          # --max-instances: caps cost - every /ask is a paid Claude API call
          # --startup-probe: the default is ONE TCP check after 240s, and a cold start (PyTorch import +
          #   embedding model + index, read from a ~600 MB image) can exceed that. Poll /health instead:
          #   up to 60 x 10s = 600s (Cloud Run's max), and pass only once the index is loaded AND the API
          #   key is set - a broken revision fails the deploy and the previous one keeps serving.
          flags: >-
            --port=8000
            --memory=2Gi
            --cpu=1
            --cpu-boost
            --min-instances=0
            --max-instances=2
            --concurrency=20
            --timeout=60
            --startup-probe=httpGet.path=/health,httpGet.port=8000,periodSeconds=10,timeoutSeconds=5,failureThreshold=60
            --service-account=${{ vars.GCP_RUNTIME_SA }}
            --allow-unauthenticated
          # Google's front end appends the real client IP to X-Forwarded-For; the rate limiter reads it
          env_vars: |
            TRUSTED_PROXY_HOPS=1
          secrets: |
            ANTHROPIC_API_KEY=anthropic-api-key:latest

      - name: Smoke test the live service
        run: |
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors "${{ steps.deploy.outputs.url }}/health"
          echo "Deployed: ${{ steps.deploy.outputs.url }}"
